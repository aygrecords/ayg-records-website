<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYG Records — Site Admin</title>
</head>
<body>
  <!-- Decap CMS. Reads ./config.yml, uses Netlify Identity + Git Gateway
       (or GitHub/GitLab backend) for login, and writes edits as commits
       to the site's git repo. Requires the site to be deployed via
       Netlify (or another supported host) — this page does nothing
       useful opened as a local file. -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
        }
      });
    }
  </script>
</body>
</html>
