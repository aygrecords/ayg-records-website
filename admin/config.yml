# Admin Configuration 
backend:
  name: git-way
  name: https://aygrecords.github.io/ayg-records-website/
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "homepage"
    label: "Homepage"
    files:
      - name: "hero"
        label: "Hero Section"
        file: "content/homepage/hero.yml"
        fields:
          - label: "Eyebrow"
            name: "eyebrow"
            widget: "string"
            required: true

          - label: "Headline"
            name: "headline"
            widget: "string"

          - label: "Description"
            name: "description"
            widget: "text"
            required: true

          - label: "Hero Image"
            name: "image"
            widget: "image"
            required: true

          - label: "Primary Button Text"
            name: "primary_button_text"
            widget: "string"
            required: true

          - label: "Primary Button URL"
            name: "primary_button_url"
            widget: "string"
            required: true

          - label: "Secondary Button Text"
            name: "secondary_button_text"
            widget: "string"
            required: true

          - label: "Secondary Button URL"
            name: "secondary_button_url"
            widget: "string"
            required: true

      - name: "featured-release"
        label: "Featured Release"
        file: "content/homepage/featured-release.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Artist"
            name: "artist"
            widget: "string"
            required: true

          - label: "Description"
            name: "description"
            widget: "text"
            required: true

          - label: "Artwork"
            name: "artwork"
            widget: "image"
            required: true

          - label: "Listen URL"
            name: "listen_url"
            widget: "string"
            required: true

  - name: "downloads"
    label: "Downloads"
    files:
      - name: "press-kit"
        label: "Press Kit"
        file: "content/downloads/press-kit.yml"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
            required: true

          - label: "Description"
            name: "description"
            widget: "text"
            required: true

          - label: "Press Kit File"
            name: "file"
            widget: "file"
            required: true
